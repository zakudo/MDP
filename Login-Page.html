<!DOCTYPE html>
<html>
<head>

<title>Login - Energy Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

.login-box{
background:rgba(255,255,255,0.1);
padding:40px;
border-radius:15px;
backdrop-filter:blur(10px);
text-align:center;
width:300px;
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#00c853;
border:none;
border-radius:8px;
color:white;
font-size:16px;
cursor:pointer;
}

.loader{
border:4px solid #f3f3f3;
border-top:4px solid #1ecb6b;
border-radius:50%;
width:30px;
height:30px;
animation:spin 1s linear infinite;
margin:15px auto;
display:none;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

</style>

</head>

<body>


<div class="login-box">

<h2>⚡Energy Dashboard</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button id="loginBtn" onclick="login()">Login</button>
<div id="loader" class="loader"></div>

<p id="msg"></p>

</div>

<script>

var firebaseConfig={
apiKey:"AIzaSyCDWJPUWHt1ntqz3XDKkc97N1USr_0XX90",
authDomain:"pzieoelcetric00.firebaseapp.com",
databaseURL:"https://pzieoelcetric00-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig)

function login(){

var email=document.getElementById("email").value
var password=document.getElementById("password").value

firebase.auth().signInWithEmailAndPassword(email,password)

.then(function(){

window.location="dashboard3.html"

})

.catch(function(error){

document.getElementById("msg").innerText=error.message

})

}

function login(){

document.getElementById("loader").style.display="block"
document.getElementById("loginBtn").innerText="Logging in..."

var email=document.getElementById("email").value
var password=document.getElementById("password").value

firebase.auth().signInWithEmailAndPassword(email,password)

.then(function(){

setTimeout(function(){
window.location="dashboard3.html"
},800)

})

.catch(function(error){

document.getElementById("loader").style.display="none"
document.getElementById("loginBtn").innerText="Login"

alert(error.message)

})

}

</script>

</body>
</html>
